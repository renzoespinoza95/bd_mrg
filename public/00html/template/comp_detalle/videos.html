<section class="padding-medium bg-gray">
  <div class="container">

    <h3 class="text-center mb-4">Experiencia</h3>

    <div class="row">

      {{#videos}}
      <div class="col-md-4">

        <div class="video-thumb"
             data-video="{{codigo_web}}"
             style="cursor:pointer; position:relative;">

          <img src="{{url_img}}" style="width:100%; margin-bottom:20px;">

          <!-- ICONO PLAY -->
          <div style="
            position:absolute;
            top:40%;
            left:45%;
            font-size:40px;
            color:white;">
            <i class="fa fa-play-circle"></i>
          </div>

        </div>

      </div>
      {{/videos}}

    </div>

  </div>
</section>

<!-- 🔥 MODAL VIDEO (ESTILO NUEVO) -->
<div class="modal fade" id="modalVideo" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content" style="background:#000; position:relative;">

      <!-- ❌ BOTÓN CERRAR -->
      <button class="btn-cerrar-video">&times;</button>

      <div class="modal-body p-0">
        <iframe 
          id="iframeVideo"
          width="100%" 
          height="500"
          src=""
          frameborder="0"
          allow="autoplay; fullscreen"
          allowfullscreen>
        </iframe>
      </div>

    </div>
  </div>
</div>
