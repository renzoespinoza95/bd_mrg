<div class="form-actions">
  <button class="btn btn-success" @click="abrirModalCrear">
    <i class="icon-plus icon-white"></i> Nuevo Slider
  </button>
</div>

<table id="tablaSliders" class="table table-bordered table-striped">
  <thead>
    <tr>
      <th>ID</th>
      <th>Grupo</th>
      <th>Vista</th>
      <th>Orden</th>
      <th style="text-align:center;">Visible</th>
      <th>Creación</th>
      <th>Fin</th>
      <th>Negocio ID</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody id="sortable">
    <tr v-for="s in sliders" :key="s.slider_id" :data-id="s.slider_id">
      <td v-text="s.slider_id"></td>
      <td>
        <select class="input-mini" style="margin-bottom:0; width:70px;" v-model="s.grupo" @change="cambiarGrupo(s)">
          <option :value="null">-</option>
          <option v-for="l in letrasAZ" :key="l" :value="l" v-text="l"></option>
        </select>
      </td>
      <td>
        <img :src="s.img_thumb" style="max-width:100px; max-height:60px;" />
      </td>
      <td style="text-align:center;">
        <span class="label label-info drag-handle">
          ⇅ (<span v-text="s.orden"></span>)
        </span>
      </td>
      <td style="text-align:center;">
        <input 
          type="checkbox" 
          :checked="s.is_visible == 1" 
          @change="cambiarVisible(s)"
          style="cursor:pointer;"
        />
      </td>
      <td v-text="s.fecha_creacion"></td>
      <td v-text="s.fecha_fin"></td>
      <td v-text="s.neg_id"></td>
      <td>
        <div class="btn-group">
          <button class="btn btn-mini dropdown-toggle" data-toggle="dropdown">
            ⚙ <span class="caret"></span>
          </button>
          <ul class="dropdown-menu">
            <li><a href="#" @click.prevent="abrirModalEditar(s)">Editar</a></li>
            <li><a href="#" @click.prevent="eliminarSlider(s)">Eliminar</a></li>
            <li><a href="#" @click.prevent="abrirModalDetalle(s)">Detalle</a></li>
            <li><a href="#" @click.prevent="cambiarUrlImg(s)">URL</a></li>
          </ul>
        </div>
      </td>
    </tr>
  </tbody>
</table>
