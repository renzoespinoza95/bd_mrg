<!-- MODAL LISTAR CATEGORIAS -->
<div id="modalCategorias" class="modal hide fade fullscreen">
  <div class="modal-header">
    <button type="button" class="close" data-dismiss="modal">×</button>
    <h3>Categorías</h3>
  </div>

  <div class="modal-body">
    <table id="tablaCat" class="table table-bordered table-condensed" style="width: 100%;">
      <thead>
        <tr>
          <th>ID</th>
          <th style="width: 70px; text-align: center;">Vista</th>
          <th>Titulo</th>
          <th>Clave</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="modal-footer" style="text-align: left;">
    <button class="btn btn-success" @click="abrirCrearCategoria">Agregar</button>
    <button class="btn" data-dismiss="modal">Cerrar</button>
  </div>
</div>

<!-- MODAL CREAR CATEGORIA -->
<div id="modalCrearCategoria" class="modal hide fade fullscreen">
  <div class="modal-header">
    <button type="button" class="close" data-dismiss="modal">×</button>
    <h3>Nueva Categoría</h3>
  </div>
  <div class="modal-body">
    <label><b>Título</b></label>
    <input v-model="catForm.titulo" class="input-xxlarge" placeholder="Titulo"><br><br>

    <label><b>Clave TXT</b></label>
    <input v-model="catForm.clave_txt" class="input-xxlarge" placeholder="Clave TXT"><br><br>

    <label><b>URL Imagen</b></label>
    <input v-model="catForm.url_img" class="input-xxlarge" placeholder="https://..."><br><br>

    <div v-if="catForm.url_img" style="margin-top: 5px;">
      <img :src="catForm.url_img" style="max-width: 120px; max-height: 80px; border-radius: 4px; border: 1px solid #ccc;">
    </div>
  </div>
  <div class="modal-footer" style="text-align: left;">
    <button class="btn btn-primary" @click="guardarCategoria">Guardar</button>
    <button class="btn" data-dismiss="modal">Cancelar</button>
  </div>
</div>

<!-- MODAL EDITAR CATEGORIA -->
<div id="modalEditarCategoria" class="modal hide fade fullscreen">
  <div class="modal-header">
    <button type="button" class="close" data-dismiss="modal">×</button>
    <h3>Editar Categoría</h3>
  </div>
  <div class="modal-body">
    <input v-model="catForm.cat_pag_web_id" type="hidden">
    
    <label><b>Título</b></label>
    <input v-model="catForm.titulo" class="input-xxlarge" placeholder="Titulo"><br><br>

    <label><b>Clave TXT</b></label>
    <input v-model="catForm.clave_txt" class="input-xxlarge" placeholder="Clave TXT"><br><br>

    <label><b>URL Imagen</b></label>
    <input v-model="catForm.url_img" class="input-xxlarge" placeholder="https://..."><br><br>

    <div v-if="catForm.url_img" style="margin-top: 5px;">
      <img :src="catForm.url_img" style="max-width: 120px; max-height: 80px; border-radius: 4px; border: 1px solid #ccc;">
    </div>
  </div>
  <div class="modal-footer" style="text-align: left;">
    <button class="btn btn-primary" @click="actualizarCategoria">Guardar</button>
    <button class="btn" data-dismiss="modal">Cerrar</button>
  </div>
</div>
