<!-- MODAL LISTAR SUBCATEGORIAS -->
<div id="modalSubcategorias" class="modal hide fade fullscreen">
  <div class="modal-header">
    <button type="button" class="close" data-dismiss="modal">×</button>
    <h3>Subcategorías</h3>
  </div>

  <div class="modal-body">
    <table id="tablaSubcat" class="table table-bordered table-condensed" style="width: 100%;">
      <thead>
        <tr>
          <th>ID</th>
          <th style="width: 70px; text-align: center;">Vista</th>
          <th>Titulo</th>
          <th>Clave</th>
          <th>Categoría</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="modal-footer" style="text-align: left;">
    <button class="btn btn-success" @click="abrirCrearSubcat">
      <i class="icon-plus icon-white"></i> Agregar
    </button>
    <button class="btn" data-dismiss="modal">Cerrar</button>
  </div>
</div>

<!-- MODAL CREAR SUBCATEGORIA -->
<div id="modalCrearSubcat" class="modal hide fade fullscreen">
  <div class="modal-header">
    <button type="button" class="close" data-dismiss="modal">×</button>
    <h3>Nueva Subcategoría</h3>
  </div>

  <div class="modal-body">
    <label><b>Título</b></label>
    <input v-model="subcatForm.titulo" class="input-xxlarge" placeholder="Titulo"><br><br>

    <label><b>Clave TXT</b></label>
    <input v-model="subcatForm.clave_txt" class="input-xxlarge" placeholder="Clave TXT"><br><br>

    <label><b>URL Imagen</b></label>
    <input v-model="subcatForm.url_img" class="input-xxlarge" placeholder="https://..."><br><br>

    <div v-if="subcatForm.url_img" style="margin-top: 5px; margin-bottom: 10px;">
      <img :src="subcatForm.url_img" style="max-width: 120px; max-height: 80px; border-radius: 4px; border: 1px solid #ccc;">
    </div>

    <label><b>Categoría Padre</b></label>
    <v-select
      :options="categorias"
      label="titulo"
      v-model="subcatForm.cat"
      placeholder="Selecciona categoría"
    ></v-select>
  </div>

  <div class="modal-footer" style="text-align: left;">
    <button class="btn btn-primary" @click="guardarSubcat">Guardar</button>
    <button class="btn" data-dismiss="modal">Cerrar</button>
  </div>
</div>

<!-- MODAL EDITAR SUBCATEGORIA -->
<div id="modalEditarSubcat" class="modal hide fade fullscreen">
  <div class="modal-header">
    <button type="button" class="close" data-dismiss="modal">×</button>
    <h3>Editar Subcategoría</h3>
  </div>

  <div class="modal-body">
    <label><b>Título</b></label>
    <input v-model="subcatForm.titulo" class="input-xxlarge" placeholder="Titulo"><br><br>

    <label><b>Clave TXT</b></label>
    <input v-model="subcatForm.clave_txt" class="input-xxlarge" placeholder="Clave TXT"><br><br>

    <label><b>URL Imagen</b></label>
    <input v-model="subcatForm.url_img" class="input-xxlarge" placeholder="https://..."><br><br>

    <div v-if="subcatForm.url_img" style="margin-top: 5px; margin-bottom: 10px;">
      <img :src="subcatForm.url_img" style="max-width: 120px; max-height: 80px; border-radius: 4px; border: 1px solid #ccc;">
    </div>

    <label><b>Categoría Padre</b></label>
    <v-select
      :options="categorias"
      label="titulo"
      v-model="subcatForm.cat"
    ></v-select>
  </div>

  <div class="modal-footer" style="text-align: left;">
    <button class="btn btn-primary" @click="actualizarSubcat">Guardar</button>
    <button class="btn" data-dismiss="modal">Cerrar</button>
  </div>
</div>
