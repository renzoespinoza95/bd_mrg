<!-- Formulario Lateral de Cotización -->
<div class="col-lg-4">
  <div class="quote-box">
    <h4 class="text-white text-center mb-3" style="font-size: 1.8rem; letter-spacing: 1px;">{{cta_titulo}}</h4>
    <p class="text-white-50 text-center small mb-3">{{cta_texto}}</p>
    <form>
      <input type="text" class="form-control" placeholder="Nombre completo:">
      <input type="text" class="form-control" placeholder="Empresa:">
      <input type="text" class="form-control" placeholder="RUC:">
      <input type="text" class="form-control" placeholder="Teléfono:">
      <input type="email" class="form-control" placeholder="Correo Electrónico:">
      
      <div class="mt-3 text-center">
        <a href="{{url_whatsapp}}" target="_blank" class="btn-cat-pill w-100">
          <span class="pill-text">ENVIAR COTIZACIÓN</span>
          <span class="pill-circle"><i class="fa-solid fa-arrow-right fa-xs"></i></span>
        </a>
      </div>
    </form>

    <!-- Burbuja Flotante de WhatsApp -->
    <a href="{{url_whatsapp}}" target="_blank" class="whatsapp-bubble">
      <i class="fa-brands fa-whatsapp fs-5"></i>
      <span>¡Hola!<br>Estoy aquí para ayudarte</span>
    </a>
  </div>
</div>
