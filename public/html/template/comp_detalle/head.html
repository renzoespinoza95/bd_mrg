<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{titulo}} - {{title}}</title>
  <meta name="description" content="{{meta_description}}">
  <meta name="keywords" content="{{meta_keywords}}">
  <meta name="author" content="MRG Asesoramiento y Reparaciones">
  <base href="{{base}}">
  <link rel="icon" type="image/png" href="{{favicon}}">

  <!-- Open Graph -->
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{titulo}} - {{title}}">
  <meta property="og:description" content="{{meta_description}}">
  <meta property="og:image" content="https://barsi-img.b-cdn.net/t_mrg/1fta7k.jpg">
  <meta property="og:url" content="{{url_inicio}}">
  <meta property="og:site_name" content="MRG Asesoramiento y Reparaciones">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS & Font Awesome 6 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">

  <style>
    :root {
      --mrg-blue: #242878;
      --mrg-blue-dark: #171a54;
      --mrg-gold: #b79237;
      --mrg-gold-dark: #8c6d21;
      --mrg-gradient: linear-gradient(90deg, #242878 0%, #3a3f9e 60%, #b79237 100%);
      --font-body: 'Montserrat', sans-serif;
      --font-titles: 'Bebas Neue', sans-serif;
    }

    body {
      font-family: var(--font-body);
      color: #333333;
      background-color: #ffffff;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, h5, h6, .display-titles {
      font-family: var(--font-titles);
      letter-spacing: 1.5px;
      color: var(--mrg-blue);
      text-transform: uppercase;
    }

    .top-header {
      border-bottom: 1px solid #e9ecef;
      padding: 10px 0;
    }
    .social-icon-box {
      width: 28px;
      height: 28px;
      background: #e9ecef;
      color: #555;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      text-decoration: none;
      font-size: 0.8rem;
      transition: all 0.2s ease;
    }
    .social-icon-box:hover {
      background: var(--mrg-blue);
      color: #fff;
    }
    .phone-badge {
      font-family: var(--font-titles);
      font-size: 1.6rem;
      color: var(--mrg-blue);
      letter-spacing: 1px;
    }
    .anniversary-badge {
      font-family: var(--font-body);
      font-size: 0.65rem;
      line-height: 1.1;
      font-weight: 700;
      color: var(--mrg-blue);
      border-left: 2px solid #ccc;
      padding-left: 10px;
    }
    .anniversary-badge span {
      font-size: 1.4rem;
      font-family: var(--font-titles);
      line-height: 1;
      display: block;
    }

    .nav-bar-container {
      border-bottom: 2px solid var(--mrg-blue);
    }
    .main-nav .nav-link {
      font-family: var(--font-titles);
      color: #333;
      font-size: 1.25rem;
      letter-spacing: 1px;
      padding: 10px 18px;
      transition: all 0.2s;
    }
    .main-nav .nav-link:hover,
    .main-nav .nav-link.active {
      background-color: var(--mrg-blue);
      color: #fff !important;
    }

    .btn-drawer-toggle {
      background: var(--mrg-blue);
      color: #fff;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(36, 40, 120, 0.35);
      cursor: pointer;
    }

    .modal-drawer .modal-content {
      border-radius: 16px;
      border: none;
      background: var(--mrg-blue-dark);
      color: #ffffff;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45);
    }
    .modal-drawer .drawer-nav-link {
      font-family: var(--font-titles);
      color: #eee;
      text-decoration: none;
      font-size: 1.4rem;
      letter-spacing: 1px;
      padding: 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .custom-breadcrumb {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .custom-breadcrumb a {
      color: #666;
      text-decoration: none;
    }
    .custom-breadcrumb a:hover {
      color: var(--mrg-blue);
    }
    .custom-breadcrumb span {
      color: var(--mrg-blue);
    }

    .btn-cat-pill {
      font-family: var(--font-titles);
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      background: var(--mrg-gradient);
      color: #ffffff !important;
      letter-spacing: 1.5px;
      border-radius: 50px;
      padding: 5px 6px 5px 22px;
      text-decoration: none;
      border: none;
      box-shadow: 0 4px 12px rgba(36, 40, 120, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }
    .btn-cat-pill:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(183, 146, 55, 0.45);
    }
    .btn-cat-pill .pill-text {
      font-size: 1.15rem;
      margin-right: 14px;
      margin-top: 2px;
    }
    .btn-cat-pill .pill-circle {
      background-color: #ffffff;
      color: var(--mrg-blue);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      flex-shrink: 0;
    }

    .btn-social-share {
      border: 1px solid #ced4da;
      color: var(--mrg-blue);
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-social-share:hover {
      background-color: var(--mrg-blue);
      color: #fff;
    }

    .quote-box {
      background-color: var(--mrg-blue);
      border-radius: 6px;
      padding: 24px;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      position: relative;
    }
    .quote-box .form-control {
      border-radius: 3px;
      margin-bottom: 12px;
      font-size: 0.85rem;
      font-family: var(--font-body);
      border: none;
      padding: 10px 14px;
    }
    .whatsapp-bubble {
      position: absolute;
      right: -15px;
      bottom: -15px;
      background-color: #00b027;
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 10;
    }

    .spec-table-header {
      background-color: var(--mrg-blue);
      color: #fff;
      font-family: var(--font-titles);
      font-size: 1.3rem;
      padding: 8px 16px;
      letter-spacing: 1px;
    }
    .spec-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    .spec-table th, .spec-table td {
      padding: 9px 14px;
      border: 1px solid #dee2e6;
    }
    .spec-table td:first-child {
      background-color: #fdfdfd;
      font-weight: 600;
      color: #444;
      width: 60%;
    }
    .spec-table td:last-child {
      background-color: #e9ecef;
      text-align: center;
      font-weight: 700;
      color: #222;
      width: 40%;
    }

    .tile-card {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background-color: #1a1a1a;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }
    .tile-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.45s ease;
    }
    .tile-card.is-active img {
      transform: scale(1.08);
    }
    .tile-footer {
      font-family: var(--font-titles);
      letter-spacing: 1px;
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(36, 40, 120, 0.85);
      color: #fff;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.25rem;
      z-index: 2;
    }
    .tile-overlay {
      position: absolute;
      inset: 0;
      background-color: rgba(23, 26, 84, 0.94);
      color: #fff;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s ease;
      z-index: 5;
    }
    .tile-overlay.is-active {
      opacity: 1;
      visibility: visible;
    }
    .tile-overlay .overlay-title {
      font-family: var(--font-titles);
      font-size: 1.4rem;
      letter-spacing: 1px;
      color: var(--mrg-gold);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(183, 146, 55, 0.3);
      padding-bottom: 8px;
    }
    .tile-overlay .overlay-text {
      font-family: var(--font-body);
      font-size: 0.85rem;
      line-height: 1.45;
      color: #e2e8f0;
      margin: auto 0;
    }

    footer {
      background-color: #f8f9fa;
      border-top: 1px solid #e9ecef;
      padding: 25px 0;
      font-size: 0.75rem;
      color: #777;
    }
    footer a {
      color: var(--mrg-blue);
      text-decoration: none;
      font-weight: 600;
    }

    /* ========================================================= */
    /* 🔥 ESTILOS DEL MODAL DESLIZANTE DE SUBCATEGORÍAS (2da imagen) */
    /* ========================================================= */
    .slider-modal-container {
      overflow: hidden;
      position: relative;
      width: 100%;
      min-height: 380px;
    }
    .slider-modal-track {
      display: flex;
      width: 200%;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .slider-modal-panel {
      width: 50%;
      padding: 10px 5px;
      box-sizing: border-box;
    }
    .slider-modal-track.slide-right {
      transform: translateX(-50%);
    }

    .subcat-list-item {
      background: #ffffff;
      border: 1.5px solid #dce4f2;
      border-radius: 10px;
      padding: 14px 20px;
      margin-bottom: 12px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.25s ease;
      font-weight: 700;
      color: var(--mrg-blue);
      box-shadow: 0 2px 5px rgba(36, 40, 120, 0.04);
    }
    .subcat-list-item:hover {
      background: #f0f4ff;
      border-color: var(--mrg-blue);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(36, 40, 120, 0.12);
    }
    .subcat-list-item .badge {
      background-color: var(--mrg-gold) !important;
      color: #ffffff !important;
      font-weight: 700;
      font-size: 0.82rem;
      padding: 6px 12px;
      border-radius: 50px;
    }

    .product-list-card {
      border: 1px solid #e6e8f0;
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      color: inherit;
      display: block;
      background: #fff;
    }
    .product-list-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 15px rgba(36,40,120,0.12);
      border-color: var(--mrg-gold);
    }
    .product-list-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
    }
    .product-list-card h6 {
      font-family: var(--font-titles);
      font-size: 1.15rem;
      letter-spacing: 0.5px;
      color: var(--mrg-blue);
      margin: 8px 10px 10px;
    }
  </style>
</head>
