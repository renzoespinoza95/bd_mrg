<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{titulo}} - {{title}}</title>
  <meta name="description" content="{{meta_description}}">
  <meta name="keywords" content="{{meta_keywords}}">
  <base href="{{base}}">
  <link rel="icon" type="image/png" href="{{favicon}}">

  <!-- Google Fonts: Bebas Neue y Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">

  <style>
    :root {
      --cat-orange-gradient: linear-gradient(90deg, #ff8800 0%, #ff5100 60%, #ff3700 100%);
      --brand-navy: #0d3b66;
      --brand-blue-accent: #002b49;
      --font-body: 'Montserrat', sans-serif;
      --font-titles: 'Bebas Neue', sans-serif;
    }

    body {
      font-family: var(--font-body);
      color: #333333;
      background-color: #ffffff;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, h5, h6, .display-titles {
      font-family: var(--font-titles);
      letter-spacing: 1.5px;
      color: var(--brand-navy);
      text-transform: uppercase;
    }

    .top-header {
      border-bottom: 1px solid #e9ecef;
      padding: 10px 0;
    }
    .social-icon-box {
      width: 28px;
      height: 28px;
      background: #e9ecef;
      color: #555;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      text-decoration: none;
      font-size: 0.8rem;
      transition: all 0.2s ease;
    }
    .social-icon-box:hover {
      background: var(--brand-navy);
      color: #fff;
    }
    .phone-badge {
      font-family: var(--font-titles);
      font-size: 1.6rem;
      color: var(--brand-navy);
      letter-spacing: 1px;
    }
    .anniversary-badge {
      font-family: var(--font-body);
      font-size: 0.65rem;
      line-height: 1.1;
      font-weight: 700;
      color: #0d3b66;
      border-left: 2px solid #ccc;
      padding-left: 10px;
    }
    .anniversary-badge span {
      font-size: 1.4rem;
      font-family: var(--font-titles);
      line-height: 1;
      display: block;
    }

    .nav-bar-container {
      border-bottom: 2px solid #002b49;
    }
    .main-nav .nav-link {
      font-family: var(--font-titles);
      color: #333;
      font-size: 1.25rem;
      letter-spacing: 1px;
      padding: 10px 18px;
      transition: all 0.2s;
    }
    .main-nav .nav-link:hover,
    .main-nav .nav-link.active {
      background-color: var(--brand-navy);
      color: #fff !important;
    }

    .btn-drawer-toggle {
      background: var(--cat-orange-gradient);
      color: #fff;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(255, 81, 0, 0.35);
      cursor: pointer;
    }

    .modal-drawer .modal-content {
      border-radius: 16px;
      border: none;
      background: #18191c;
      color: #ffffff;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45);
    }
    .modal-drawer .drawer-nav-link {
      font-family: var(--font-titles);
      color: #eee;
      text-decoration: none;
      font-size: 1.4rem;
      letter-spacing: 1px;
      padding: 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .custom-breadcrumb {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .custom-breadcrumb a {
      color: #666;
      text-decoration: none;
    }
    .custom-breadcrumb a:hover {
      color: var(--brand-navy);
    }
    .custom-breadcrumb span {
      color: var(--brand-navy);
    }

    .btn-cat-pill {
      font-family: var(--font-titles);
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      background: var(--cat-orange-gradient);
      color: #ffffff !important;
      letter-spacing: 1.5px;
      border-radius: 50px;
      padding: 5px 6px 5px 22px;
      text-decoration: none;
      border: none;
      box-shadow: 0 4px 12px rgba(255, 61, 0, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }
    .btn-cat-pill:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(255, 61, 0, 0.45);
    }
    .btn-cat-pill .pill-text {
      font-size: 1.15rem;
      margin-right: 14px;
      margin-top: 2px;
    }
    .btn-cat-pill .pill-circle {
      background-color: #ffffff;
      color: #ff4500;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      flex-shrink: 0;
    }

    .btn-social-share {
      border: 1px solid #ced4da;
      color: var(--brand-navy);
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-social-share:hover {
      background-color: var(--brand-navy);
      color: #fff;
    }

    .quote-box {
      background-color: #0b3c68;
      border-radius: 6px;
      padding: 24px;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      position: relative;
    }
    .quote-box .form-control {
      border-radius: 3px;
      margin-bottom: 12px;
      font-size: 0.85rem;
      font-family: var(--font-body);
      border: none;
      padding: 10px 14px;
    }
    .whatsapp-bubble {
      position: absolute;
      right: -15px;
      bottom: -15px;
      background-color: #00b027;
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 10;
    }

    .spec-table-header {
      background-color: #002b49;
      color: #fff;
      font-family: var(--font-titles);
      font-size: 1.3rem;
      padding: 8px 16px;
      letter-spacing: 1px;
    }
    .spec-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    .spec-table th, .spec-table td {
      padding: 9px 14px;
      border: 1px solid #dee2e6;
    }
    .spec-table td:first-child {
      background-color: #fdfdfd;
      font-weight: 600;
      color: #444;
      width: 60%;
    }
    .spec-table td:last-child {
      background-color: #e9ecef;
      text-align: center;
      font-weight: 700;
      color: #222;
      width: 40%;
    }

    .tile-card {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background-color: #1a1a1a;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }
    .tile-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.45s ease;
    }
    .tile-card.is-active img {
      transform: scale(1.08);
    }
    .tile-footer {
      font-family: var(--font-titles);
      letter-spacing: 1px;
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(13, 59, 102, 0.85);
      color: #fff;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.25rem;
      z-index: 2;
    }
    .tile-overlay {
      position: absolute;
      inset: 0;
      background-color: rgba(13, 59, 102, 0.94);
      color: #fff;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s ease;
      z-index: 5;
    }
    .tile-overlay.is-active {
      opacity: 1;
      visibility: visible;
    }
    .tile-overlay .overlay-title {
      font-family: var(--font-titles);
      font-size: 1.4rem;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding-bottom: 8px;
    }
    .tile-overlay .overlay-text {
      font-family: var(--font-body);
      font-size: 0.85rem;
      line-height: 1.45;
      color: #e2e8f0;
      margin: auto 0;
    }

    footer {
      background-color: #f8f9fa;
      border-top: 1px solid #e9ecef;
      padding: 25px 0;
      font-size: 0.75rem;
      color: #777;
    }
    footer a {
      color: var(--brand-navy);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
