<!-- Sección de Modelos y Especificaciones Técnicas -->
<div class="row mb-5">
  <div class="col-lg-6 col-md-8">
    <div class="d-flex align-items-center gap-2 mb-3">
      <h4 class="m-0" style="font-size: 1.5rem;">DATOS CLAVE</h4>
      <div class="rounded-circle bg-danger text-white fw-bold d-flex align-items-center justify-content-center" style="width: 22px; height: 22px; font-size: 0.7rem;">V</div>
      <span style="font-weight: 800; font-size: 0.9rem; color: #444;">{{cliente}} SAC</span>
    </div>

    <div class="spec-table-header">{{titulo}}</div>
    <table class="spec-table">
      <tbody>
        <tr>
          <td>Cliente / Fabricante</td>
          <td>{{cliente}}</td>
        </tr>
        <tr>
          <td>Año de Referencia</td>
          <td>{{anio}}</td>
        </tr>
        <tr>
          <td>Categoría Industrial</td>
          <td>{{categoria}}</td>
        </tr>
        <tr>
          <td>Estado Operativo</td>
          <td>Disponible / Certificado</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
