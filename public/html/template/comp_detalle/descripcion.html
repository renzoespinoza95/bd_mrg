<!-- Descripción y Marca -->
<div class="col-lg-4 col-md-6">
  <h3 class="mb-1" style="font-size: 2rem;">{{titulo}}</h3>
  
  <div class="d-flex align-items-center gap-2 my-2 pb-2 border-bottom">
    <div class="rounded-circle bg-danger text-white fw-bold d-flex align-items-center justify-content-center" style="width: 24px; height: 24px; font-size: 0.75rem;">M</div>
    <span style="font-weight: 800; letter-spacing: 0.5px; font-size: 0.95rem; color: #444;">{{cliente}}</span>
  </div>

  <h6 class="fw-bold mt-3 mb-2" style="font-family: var(--font-body); font-size: 0.85rem;">Descripción Completa:</h6>
  <div class="text-secondary" style="font-size: 0.82rem; line-height: 1.6;">
    {{{contenido}}}
  </div>
</div>
