<!-- Sección Convenios (Múltiples elementos en cuadros independientes sin hover) -->
<div class="mt-4 pt-4 border-top">
  <h3 class="text-center mb-4" style="font-size: 2rem;">REPRESENTACION / DISTRIBUIDOR</h3>
  <div class="row justify-content-center g-3">
    {{#convenio}}
    <div class="col-6 col-md-3">
      <div class="tile-card tile-convenio">
        <img src="{{url_img}}" alt="{{titulo}}" class="btn-preview-img" data-img-src="{{url_img}}" title="Clic para ampliar imagen" style="width: 100%; height: 100%; object-fit: contain; cursor: pointer;">
        <div class="tile-footer"><span>{{titulo}}</span></div>
      </div>
    </div>
    {{/convenio}}
  </div>
</div>
