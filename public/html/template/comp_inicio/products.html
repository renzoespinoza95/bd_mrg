<!-- Grid Uniforme de Cuadrados (reg_cat_pag_web con orden = 1) -->
<main class="container pt-5 pb-4">
  <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
    <h2 class="m-0 fs-1" style="color: var(--mrg-blue);">LÍNEAS DE INGENIERÍA Y REPARACIONES</h2>
  </div>

  <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-3 mb-5 mt-2">
    {{#categorias}}
    <div class="col">
      <div class="tile-card"
           data-catid="{{cat_id}}"
           data-title="{{titulo}}" 
           data-subcats-b64="{{subcategorias_base64}}">
        <div class="tile-header">{{titulo}} <i class="fa-solid fa-plus"></i></div>
        <img src="{{url_img}}" alt="{{titulo}}">
        <div class="tile-overlay">
          <div class="overlay-title"><span>{{titulo}}</span> <i class="fa-solid fa-plus"></i></div>
          <div class="overlay-text">{{{descripcion}}}</div>
          <button type="button" class="btn-cat-pill w-100 btn-abrir-modal-cat">
            <span class="pill-text">EXPLORAR</span>
            <span class="pill-circle"><i class="fa-solid fa-arrow-right fa-xs"></i></span>
          </button>
        </div>
      </div>
    </div>
    {{/categorias}}
  </div>
</main>
