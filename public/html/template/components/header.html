<!-- Barra Principal / Header con Logo MRG -->
<header class="bg-white border-bottom py-2 sticky-top shadow-sm">
  <div class="container d-flex justify-content-between align-items-center">
    <!-- Logo MRG desde URL fija -->
    <a href="{{url_inicio}}" class="d-flex align-items-center text-decoration-none">
      <img src="https://barsi-img.b-cdn.net/t_mrg/logo_mrg.jpg" alt="MRG ASESORAMIENTO Y REPARACIONES" class="brand-logo-img me-2">
    </a>

    <!-- Menú Desktop Horizontal sin flechas hacia abajo -->
    <nav class="nav main-nav d-none d-lg-flex align-items-center">
      <a class="nav-link" href="{{url_inicio}}">INICIO</a>
      {{#nav_left}}
      <a class="nav-link" href="{{url}}">{{titulo}}</a>
      {{/nav_left}}
      {{#nav_right}}
      <a class="nav-link" href="{{url}}">{{titulo}}</a>
      {{/nav_right}}
    </nav>

    <!-- Botón Drawer Mobile -->
    <button class="btn-drawer-toggle d-lg-none" type="button" data-bs-toggle="modal" data-bs-target="#mobileMenuDrawer" aria-label="Abrir Menú">
      <i class="fa-solid fa-bars fs-5"></i>
    </button>
  </div>
</header>

<!-- Modal Drawer Mobile -->
<div class="modal fade modal-drawer" id="mobileMenuDrawer" tabindex="-1" aria-labelledby="mobileMenuLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <img src="http://localhost:84/bd_mrg/public/html/template/assets/logo_mrg.jpg" alt="MRG ASESORAMIENTO Y REPARACIONES" style="max-height: 40px; background:#fff; padding:3px 6px; border-radius:4px;">
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <nav class="d-flex flex-column mb-3">
          <a href="{{url_inicio}}" class="drawer-nav-link">Inicio</a>
          {{#nav_left}}
          <a href="{{url}}" class="drawer-nav-link">{{titulo}}</a>
          {{/nav_left}}
          {{#nav_right}}
          <a href="{{url}}" class="drawer-nav-link">{{titulo}}</a>
          {{/nav_right}}
        </nav>
        
        <div class="pt-2 border-top border-secondary text-light small-body-text">
          <span>Visitas: {{visitas}}</span>
        </div>
      </div>
    </div>
  </div>
</div>
