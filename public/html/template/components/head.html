<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{titulo_pag_web}}</title>
  <meta name="description" content="{{meta_description}}">
  <meta name="keywords" content="{{meta_keywords}}">
  <base href="{{base}}">
  <link rel="icon" type="image/png" href="{{favicon}}">

  <!-- Google Fonts: Bebas Neue y Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">

  <style>
    :root {
      --cat-yellow: #ffcd00;
      --cat-orange-gradient: linear-gradient(90deg, #ff8800 0%, #ff5100 60%, #ff3700 100%);
      --cat-orange-dark: #e02f00;
      --cat-black: #111111;
      
      --font-body: 'Montserrat', sans-serif;
      --font-titles: 'Bebas Neue', sans-serif;
    }

    body {
      font-family: var(--font-body);
      color: #333;
      background-color: #f5f6f8;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, h5, h6, .display-6 {
      font-family: var(--font-titles);
      letter-spacing: 1px;
    }

    .main-nav .nav-link {
      font-family: var(--font-titles);
      color: #111;
      font-size: 1.25rem;
      letter-spacing: 1px;
      padding: 0.5rem 0.8rem;
    }
    .main-nav .nav-link:hover {
      color: #ff5100;
    }

    .btn-drawer-toggle {
      background: var(--cat-orange-gradient);
      color: #fff;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(255, 81, 0, 0.35);
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .btn-drawer-toggle:hover {
      transform: scale(1.05);
      color: #fff;
    }

    .modal-drawer .modal-content {
      border-radius: 16px;
      border: none;
      background: #18191c;
      color: #ffffff;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }
    .modal-drawer .modal-header {
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px 20px;
    }
    .modal-drawer .modal-body {
      padding: 20px 24px;
    }
    .modal-drawer .drawer-nav-link {
      font-family: var(--font-titles);
      color: #eee;
      text-decoration: none;
      font-size: 1.4rem;
      letter-spacing: 1px;
      padding: 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: color 0.2s ease;
    }
    .modal-drawer .drawer-nav-link:hover {
      color: var(--cat-yellow);
    }
    .modal-drawer .utility-sublink {
      font-family: var(--font-body);
      color: #aaa;
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 0;
      display: block;
    }
    .modal-drawer .utility-sublink:hover {
      color: #fff;
    }

    .btn-cat-pill {
      font-family: var(--font-titles);
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      background: var(--cat-orange-gradient);
      color: #ffffff !important;
      letter-spacing: 1.5px;
      border-radius: 50px;
      padding: 5px 6px 5px 22px;
      text-decoration: none;
      border: none;
      box-shadow: 0 4px 12px rgba(255, 61, 0, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }
    .btn-cat-pill:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(255, 61, 0, 0.45);
    }
    .btn-cat-pill .pill-text {
      font-size: 1.15rem;
      margin-right: 14px;
      margin-top: 2px;
    }
    .btn-cat-pill .pill-circle {
      background-color: #ffffff;
      color: #ff4500;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      flex-shrink: 0;
    }

    .btn-cat-pill-lg {
      padding: 7px 8px 7px 28px;
    }
    .btn-cat-pill-lg .pill-text {
      font-size: 1.4rem;
      margin-right: 18px;
    }
    .btn-cat-pill-lg .pill-circle {
      width: 40px;
      height: 40px;
      font-size: 1.1rem;
    }

    .btn-cat-pill-sm {
      padding: 3px 4px 3px 14px;
    }
    .btn-cat-pill-sm .pill-text {
      font-size: 1rem;
      margin-right: 8px;
      margin-top: 2px;
    }
    .btn-cat-pill-sm .pill-circle {
      width: 24px;
      height: 24px;
      font-size: 0.7rem;
    }

    .hero-slider-section {
      position: relative;
      background-color: #000;
    }
    .carousel-item img {
      width: 100%;
      height: 420px;
      object-fit: cover;
      display: block;
    }
    @media (max-width: 768px) {
      .carousel-item img {
        height: 260px;
      }
    }

    .carousel-control-prev, .carousel-control-next {
      width: 50px;
      opacity: 0.85;
      z-index: 10;
    }
    .carousel-indicators {
      margin-bottom: 1.2rem;
      z-index: 15;
    }
    .carousel-indicators [data-bs-target] {
      width: 12px;
      height: 12px;
      border: 1px solid #fff;
      background-color: transparent;
      opacity: 0.7;
      margin: 0 4px;
    }
    .carousel-indicators .active {
      background-color: #ff5100;
      border-color: #ff5100;
      opacity: 1;
    }

    .quote-button-anchor {
      position: absolute;
      right: 5%;
      bottom: -22px;
      z-index: 20;
    }

    .tile-card {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background-color: #1a1a1a;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }
    .tile-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.45s ease;
    }
    .tile-card.is-active img {
      transform: scale(1.08);
    }

    .tile-header, .tile-footer {
      font-family: var(--font-titles);
      letter-spacing: 1px;
      position: absolute;
      left: 0;
      right: 0;
      background: rgba(18, 18, 18, 0.82);
      color: #fff;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.15rem;
      z-index: 2;
    }
    .tile-header { top: 0; }
    .tile-footer { bottom: 0; }

    .tile-overlay {
      position: absolute;
      inset: 0;
      background-color: rgba(16, 24, 32, 0.92);
      color: #fff;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s ease;
      z-index: 5;
    }
    .tile-overlay.is-active {
      opacity: 1;
      visibility: visible;
    }
    .tile-overlay .overlay-title {
      font-family: var(--font-titles);
      font-size: 1.4rem;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      padding-bottom: 8px;
    }
    .tile-overlay .overlay-text {
      font-family: var(--font-body);
      font-size: 0.82rem;
      line-height: 1.5;
      font-weight: 400;
      color: #cfd4dc;
      margin: auto 0;
    }

    .yellow-strip {
      background-color: var(--cat-yellow);
      padding: 22px 0;
    }

    footer {
      background-color: #0d0d0d;
      color: #888;
      font-size: 0.75rem;
      padding: 40px 0 20px;
    }
    footer a {
      font-family: var(--font-titles);
      font-size: 1.1rem;
      letter-spacing: 1px;
      color: #fff;
      text-decoration: none;
    }
    
    .small-body-text {
      font-family: var(--font-body);
      font-size: 0.75rem;
    }
  </style>
</head>
