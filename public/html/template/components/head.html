<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{titulo_pag_web}}</title>
  <meta name="description" content="{{meta_description}}">
  <meta name="keywords" content="{{meta_keywords}}">
  <base href="{{base}}">
  <link rel="icon" type="image/png" href="{{favicon}}">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">

  <style>
    :root {
      /* Colores extraídos del logo MRG */
      --mrg-blue: #242878;
      --mrg-blue-dark: #171a54;
      --mrg-gold: #b79237;
      --mrg-gold-dark: #8c6d21;
      --mrg-gradient: linear-gradient(90deg, #242878 0%, #3a3f9e 60%, #b79237 100%);
      --mrg-black: #111118;
      
      --font-body: 'Montserrat', sans-serif;
      --font-titles: 'Bebas Neue', sans-serif;
    }

    body {
      font-family: var(--font-body);
      color: #333;
      background-color: #f7f8fa;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, h5, h6, .display-6 {
      font-family: var(--font-titles);
      letter-spacing: 1px;
    }

    /* Logo corporativo responsivo 350x60 */
    .brand-logo-img {
      max-height: 52px;
      width: auto;
      object-fit: contain;
    }

    /* Navegación */
    .main-nav .nav-link {
      font-family: var(--font-titles);
      color: var(--mrg-blue);
      font-size: 1.25rem;
      letter-spacing: 1px;
      padding: 0.5rem 0.8rem;
      transition: color 0.2s;
    }
    .main-nav .nav-link:hover {
      color: var(--mrg-gold);
    }

    /* Botón Móvil */
    .btn-drawer-toggle {
      background: var(--mrg-blue);
      color: #fff;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(36, 40, 120, 0.35);
      cursor: pointer;
    }

    .modal-drawer .modal-content {
      border-radius: 16px;
      border: none;
      background: var(--mrg-blue-dark);
      color: #ffffff;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45);
    }
    .modal-drawer .modal-header {
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px 20px;
    }
    .modal-drawer .drawer-nav-link {
      font-family: var(--font-titles);
      color: #eee;
      text-decoration: none;
      font-size: 1.4rem;
      letter-spacing: 1px;
      padding: 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .modal-drawer .drawer-nav-link:hover {
      color: var(--mrg-gold);
    }

    /* Botón Píldora con estética MRG */
    .btn-cat-pill {
      font-family: var(--font-titles);
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      background: var(--mrg-gradient);
      color: #ffffff !important;
      letter-spacing: 1.5px;
      border-radius: 50px;
      padding: 5px 6px 5px 22px;
      text-decoration: none;
      border: none;
      box-shadow: 0 4px 12px rgba(36, 40, 120, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }
    .btn-cat-pill:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(183, 146, 55, 0.45);
    }
    .btn-cat-pill .pill-text {
      font-size: 1.15rem;
      margin-right: 14px;
      margin-top: 2px;
    }
    .btn-cat-pill .pill-circle {
      background-color: #ffffff;
      color: var(--mrg-blue);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      flex-shrink: 0;
    }

    .btn-cat-pill-lg {
      padding: 7px 8px 7px 28px;
    }
    .btn-cat-pill-lg .pill-text {
      font-size: 1.4rem;
      margin-right: 18px;
    }
    .btn-cat-pill-lg .pill-circle {
      width: 40px;
      height: 40px;
      font-size: 1.1rem;
    }

    .btn-cat-pill-sm {
      padding: 3px 4px 3px 14px;
    }
    .btn-cat-pill-sm .pill-text {
      font-size: 1rem;
      margin-right: 8px;
    }
    .btn-cat-pill-sm .pill-circle {
      width: 24px;
      height: 24px;
      font-size: 0.7rem;
    }

    /* Slider */
    .hero-slider-section {
      position: relative;
      background-color: #000;
    }
    .carousel-item img {
      width: 100%;
      height: 440px;
      object-fit: cover;
      display: block;
    }
    @media (max-width: 768px) {
      .carousel-item img {
        height: 280px;
      }
    }

    .carousel-caption-custom {
      position: absolute;
      top: 50%;
      left: 8%;
      transform: translateY(-50%);
      z-index: 10;
      color: #fff;
      max-width: 650px;
      text-align: left;
    }
    .carousel-caption-custom .badge-cat {
      background: var(--mrg-gold);
      color: #fff;
      padding: 4px 10px;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-radius: 4px;
    }

    .quote-button-anchor {
      position: absolute;
      right: 5%;
      bottom: -22px;
      z-index: 20;
    }

    /* Cuadrados 1:1 */
    .tile-card {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background-color: #1a1a1a;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      border: 1px solid rgba(183, 146, 55, 0.2);
    }
    .tile-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.45s ease;
    }
    .tile-card.is-active img {
      transform: scale(1.08);
    }

    .tile-header {
      font-family: var(--font-titles);
      letter-spacing: 1px;
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      background: rgba(36, 40, 120, 0.88);
      color: #fff;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.15rem;
      z-index: 2;
    }

    .tile-overlay {
      position: absolute;
      inset: 0;
      background-color: rgba(23, 26, 84, 0.94);
      color: #fff;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s ease;
      z-index: 5;
    }
    .tile-overlay.is-active {
      opacity: 1;
      visibility: visible;
    }
    .tile-overlay .overlay-title {
      font-family: var(--font-titles);
      font-size: 1.4rem;
      letter-spacing: 1px;
      color: var(--mrg-gold);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(183, 146, 55, 0.3);
      padding-bottom: 8px;
    }
    .tile-overlay .overlay-text {
      font-family: var(--font-body);
      font-size: 0.82rem;
      line-height: 1.5;
      color: #d6d9ee;
      margin: auto 0;
    }

    /* Franja Dorada Inferior */
    .yellow-strip {
      background-color: var(--mrg-gold);
      padding: 22px 0;
    }

    footer {
      background-color: var(--mrg-black);
      color: #888;
      font-size: 0.75rem;
      padding: 40px 0 20px;
    }
    footer a {
      font-family: var(--font-titles);
      font-size: 1.1rem;
      letter-spacing: 1px;
      color: #fff;
      text-decoration: none;
    }
    footer a:hover {
      color: var(--mrg-gold);
    }
    .small-body-text {
      font-family: var(--font-body);
      font-size: 0.75rem;
    }

    /* ========================================================
       MODAL SLIDER HACIA LA DERECHA PARA SUBCATEGORÍAS & PRODUCTOS
       ======================================================== */
    .slider-modal-container {
      overflow: hidden;
      position: relative;
      width: 100%;
      min-height: 380px;
    }
    .slider-modal-track {
      display: flex;
      width: 200%;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .slider-modal-panel {
      width: 50%;
      padding: 10px 5px;
      box-sizing: border-box;
    }
    /* Clase que traslada el contenedor hacia el panel de productos */
    .slider-modal-track.slide-right {
      transform: translateX(-50%);
    }

    .subcat-list-item {
      background: #f8f9fc;
      border: 1px solid #e2e6f3;
      border-radius: 8px;
      padding: 14px 18px;
      margin-bottom: 10px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
      font-weight: 600;
      color: var(--mrg-blue);
    }
    .subcat-list-item:hover {
      background: var(--mrg-blue);
      color: #fff;
      border-color: var(--mrg-blue);
      transform: translateX(4px);
    }
    .subcat-list-item .badge {
      background: var(--mrg-gold);
      color: #fff;
    }

    .product-list-card {
      border: 1px solid #e6e8f0;
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      color: inherit;
      display: block;
      background: #fff;
    }
    .product-list-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 15px rgba(36,40,120,0.12);
      border-color: var(--mrg-gold);
    }
    .product-list-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
    }
    .product-list-card h6 {
      font-family: var(--font-titles);
      font-size: 1.15rem;
      letter-spacing: 0.5px;
      color: var(--mrg-blue);
      margin: 8px 10px 4px;
    }
    .product-list-card .price-tag {
      font-size: 0.8rem;
      color: var(--mrg-gold-dark);
      font-weight: 700;
      margin: 0 10px 10px;
    }
  </style>
</head>
