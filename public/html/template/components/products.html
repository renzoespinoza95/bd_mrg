<!-- Grid Uniforme de Cuadrados Idénticos (Aspect Ratio 1/1) -->
<main class="container pt-5 pb-4">
  <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-3 mb-5 mt-2">
    {{#products}}
    <div class="col">
      <div class="tile-card"
           data-title="{{titulo}}" 
           data-text="Línea técnica y especializada. Inversión referencial: S/ {{precio}}">
        <div class="tile-header">{{titulo}} <i class="fa-solid fa-plus"></i></div>
        <img src="{{img}}" alt="{{titulo}}">
        <div class="tile-overlay">
          <div class="overlay-title"><span>{{titulo}}</span> <i class="fa-solid fa-plus"></i></div>
          <p class="overlay-text"></p>
          <a href="{{url}}" class="btn-cat-pill w-100">
            <span class="pill-text">EXPLORAR</span>
            <span class="pill-circle"><i class="fa-solid fa-arrow-right fa-xs"></i></span>
          </a>
        </div>
      </div>
    </div>
    {{/products}}
  </div>
</main>
